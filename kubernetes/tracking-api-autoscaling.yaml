# Este manifesto complementa o Deployment da API aplicado pelo pipeline de deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-api
  namespace: tracking
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tracking-api
      containers:
        - name: tracking-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: tracking-runtime-config
            - secretRef:
                name: tracking-backend-secrets
          env:
            - name: TRACKING_QUEUE_ENABLED
              value: "true"
            - name: TRACKING_DISPATCHER_ROLE
              value: "true"
            - name: TRACKING_WORKER_ROLE
              value: "false"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TLS
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-api
  namespace: tracking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
