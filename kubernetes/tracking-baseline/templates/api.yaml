apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tracking-api
    app.kubernetes.io/part-of: shipment-tracking
    app.kubernetes.io/component: api
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
      labels:
        app.kubernetes.io/name: tracking-api
        app.kubernetes.io/part-of: shipment-tracking
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: tracking-backend
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tracking-api
      containers:
        - name: tracking-api
          image: {{ .Values.api.image }}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: tracking-runtime-config
            - secretRef:
                name: tracking-backend-secrets
          env:
            - name: NODE_ENV
              value: {{ .Values.environment | quote }}
            - name: OTEL_SERVICE_NAME
              value: shipment-tracking-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name={{ .Values.environment }}
            - name: PORT
              value: "3000"
            - name: API_PREFIX
              value: api/v1
            - name: TRACKING_QUEUE_ENABLED
              value: "true"
            - name: TRACKING_DISPATCHER_ROLE
              value: "true"
            - name: TRACKING_WORKER_ROLE
              value: "false"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TLS
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tracking-backend-secrets
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tracking-api
    app.kubernetes.io/part-of: shipment-tracking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracking-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: tracking-api
  namespace: {{ .Values.namespace }}
spec:
  serviceRef:
    name: tracking-api
    port: 3000
  targetGroupARN: {{ required "targetGroupArn is required" .Values.targetGroupArn | quote }}
