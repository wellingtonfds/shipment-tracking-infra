apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-worker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tracking-worker
    app.kubernetes.io/part-of: shipment-tracking
    app.kubernetes.io/component: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
      labels:
        app.kubernetes.io/name: tracking-worker
        app.kubernetes.io/part-of: shipment-tracking
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: tracking-backend
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tracking-worker
      containers:
        - name: tracking-worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: tracking-runtime-config
            - secretRef:
                name: tracking-backend-secrets
          env:
            - name: NODE_ENV
              value: {{ .Values.environment | quote }}
            - name: OTEL_SERVICE_NAME
              value: shipment-tracking-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name={{ .Values.environment }}
            - name: TRACKING_QUEUE_ENABLED
              value: "true"
            - name: TRACKING_DISPATCHER_ROLE
              value: "false"
            - name: TRACKING_WORKER_ROLE
              value: "true"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TLS
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const {statSync}=require('node:fs');if(Date.now()-statSync('/tmp/tracking-worker-health').mtimeMs>30000)process.exit(1)"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const {statSync}=require('node:fs');if(Date.now()-statSync('/tmp/tracking-worker-health').mtimeMs>30000)process.exit(1)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const {statSync}=require('node:fs');if(Date.now()-statSync('/tmp/tracking-worker-health').mtimeMs>30000)process.exit(1)"
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tracking-backend-secrets
        - name: tmp
          emptyDir: {}
