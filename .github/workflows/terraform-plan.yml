name: Terraform plan hml

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: us-east-1

jobs:
  plan:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'terraform-plan-hml' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: React to accepted command
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes',
              });
            } catch (error) {
              core.warning(`Could not add the accepted-command reaction: ${error.message}`);
            }

      - name: Resolve the pull request head
        id: pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });

            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput(
              'is_internal',
              String(pullRequest.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`),
            );

      - name: Checkout pull request head
        if: steps.pull_request.outputs.is_internal == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pull_request.outputs.head_sha }}

      - name: Configure Terraform
        if: steps.pull_request.outputs.is_internal == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: steps.pull_request.outputs.is_internal == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check formatting
        if: steps.pull_request.outputs.is_internal == 'true'
        run: terraform fmt -check -recursive .

      - name: Prepare a local Terraform workspace
        if: steps.pull_request.outputs.is_internal == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plan-hml"
          tar --exclude=.terraform -C "$GITHUB_WORKSPACE" -cf - . | tar -C "$RUNNER_TEMP/terraform-plan-hml" -xf -
          sed -i '/backend "s3" {}/d' "$RUNNER_TEMP/terraform-plan-hml/deployment/versions.tf"

      - name: Initialize without backend
        if: steps.pull_request.outputs.is_internal == 'true'
        run: terraform -chdir="$RUNNER_TEMP/terraform-plan-hml/deployment" init -input=false

      - name: Validate configuration
        if: steps.pull_request.outputs.is_internal == 'true'
        run: terraform -chdir="$RUNNER_TEMP/terraform-plan-hml/deployment" validate

      - name: Plan hml
        if: steps.pull_request.outputs.is_internal == 'true'
        run: >-
          terraform -chdir="$RUNNER_TEMP/terraform-plan-hml/deployment" plan -refresh=false -no-color
          -var-file=../environments/hml.tfvars -out=hml.tfplan

      - name: Render plan
        if: steps.pull_request.outputs.is_internal == 'true'
        run: >-
          terraform -chdir="$RUNNER_TEMP/terraform-plan-hml/deployment" show -no-color hml.tfplan
          > "$RUNNER_TEMP/hml-plan.txt"

      - name: Publish plan artifact
        if: steps.pull_request.outputs.is_internal == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-hml-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hml-plan.txt
          retention-days: 7

      - name: React to successful plan
        if: success() && steps.pull_request.outputs.is_internal == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1',
              });
            } catch (error) {
              core.warning(`Could not add the successful-plan reaction: ${error.message}`);
            }

      - name: React to failed plan
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'confused',
              });
            } catch (error) {
              core.warning(`Could not add the failed-plan reaction: ${error.message}`);
            }
