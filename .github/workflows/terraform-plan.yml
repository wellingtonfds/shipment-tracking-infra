name: Terraform plan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive ..
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: Run TFLint
        run: tflint --init && tflint --recursive
        working-directory: .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL

  plan:
    needs: validate
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      vars.TF_STATE_BUCKET != '' &&
      vars.TF_STATE_LOCK_TABLE != '' &&
      vars.HOSTED_ZONE_NAME != '' &&
      vars.ALLOWED_API_CIDRS != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, hml, prod]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: deployment
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      TF_VAR_allowed_api_cidrs: ${{ vars.ALLOWED_API_CIDRS }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize ${{ matrix.environment }} backend
        run: >-
          terraform init -reconfigure
          -backend-config="../environments/${{ matrix.environment }}.backend.hcl"
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
          -backend-config="encrypt=true"
      - name: Plan ${{ matrix.environment }}
        run: >-
          terraform plan -no-color
          -var-file="../environments/${{ matrix.environment }}.tfvars"
          -out="${{ matrix.environment }}.tfplan"
      - name: Render plan
        run: >-
          terraform show -no-color
          "${{ matrix.environment }}.tfplan"
          > "${{ matrix.environment }}-plan.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: deployment/${{ matrix.environment }}-plan.txt
          retention-days: 7
